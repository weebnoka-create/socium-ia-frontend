<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Socium IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body{
    --bg: #0b0c10;
    --panel: #101218;
    --card: #15171f;
    --stroke: rgba(242,241,238,0.08);
    --stroke-strong: rgba(242,241,238,0.15);
    --text: #f2f1ee;
    --muted: #8b8d97;
    --faint: #55565f;
    --accent-1: #6f86ff;
    --accent-2: #b06cff;

    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }

  body.light{
    --bg: #f5f5f4;
    --panel: #ffffff;
    --card: #ffffff;
    --stroke: rgba(11,12,16,0.08);
    --stroke-strong: rgba(11,12,16,0.15);
    --text: #14151a;
    --muted: #6b6d78;
    --faint: #9a9ca5;
    --accent-1: #5a6fe0;
    --accent-2: #9a54e6;
  }

  .sc-theme-toggle{
    background: var(--card);
    border: 1px solid var(--stroke);
    color: var(--text);
    border-radius: 8px;
    width: 30px; height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .sc-theme-toggle:hover{ border-color: var(--stroke-strong); }

  #layout{
    height: 100vh;
    width: 100%;
    display: flex;
  }

  .sc-sidebar{
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--stroke);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sc-newchat{
    margin: 0.9rem;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    border: 1px solid var(--stroke-strong);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .sc-newchat:hover{ border-color: var(--accent-1); }

  .sc-convlist{
    flex: 1;
    overflow-y: auto;
    padding: 0 0.6rem 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .sc-convitem{
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sc-convitem:hover{ background: var(--card); color: var(--text); }
  .sc-convitem.active{ background: var(--card); color: var(--text); border: 1px solid var(--stroke-strong); }
  .sc-convitem .title{ flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .sc-convitem .del{
    opacity: 0;
    color: var(--faint);
    font-size: 0.78rem;
    padding: 0 0.2rem;
  }
  .sc-convitem:hover .del{ opacity: 1; }
  .sc-convitem .del:hover{ color: #ff9d8a; }

  .sc-sidebar-toggle{
    display: none;
    background: var(--card);
    border: 1px solid var(--stroke);
    color: var(--text);
    border-radius: 8px;
    width: 30px; height: 30px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-right: 0.4rem;
  }

  #app{
    height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }

  @media (max-width: 720px){
    .sc-sidebar{
      position: fixed;
      inset: 0 30% 0 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    .sc-sidebar.open{ transform: translateX(0); }
    .sc-sidebar-toggle{ display: flex; }
  }

  .sc-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--stroke);
    flex-shrink: 0;
  }

  .sc-brand{ display:flex; align-items:center; gap:0.55rem; }
  .sc-dot{
    width:9px; height:9px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
    box-shadow: 0 0 12px rgba(111,134,255,0.65);
  }
  .sc-brand-name{ font-family:'Sora',sans-serif; font-weight:700; font-size:0.98rem; }

  .sc-plan{
    display:flex; align-items:center; gap:0.6rem;
    background: var(--card);
    border: 1px solid var(--stroke);
    padding: 0.35rem 0.7rem 0.35rem 0.55rem;
    border-radius: 999px;
    font-size: 0.76rem;
    color: var(--muted);
  }
  .sc-plan .badge{
    font-family:'Sora',sans-serif; font-weight:700; font-size:0.72rem;
    color: var(--text);
    background: linear-gradient(135deg, rgba(111,134,255,0.25), rgba(176,108,255,0.25));
    border: 1px solid rgba(176,108,255,0.35);
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
  }

  .sc-body{
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sc-welcome{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    gap: 1.4rem;
  }

  .sc-orb{
    width: 74px; height: 74px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #d9c8ff, var(--accent-1) 45%, var(--accent-2) 100%);
    box-shadow: 0 0 50px 10px rgba(111,134,255,0.28);
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); opacity: 0.92; }
    50%{ transform: scale(1.08); opacity: 1; }
  }

  .sc-welcome h1{
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 1.7rem;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .sc-welcome p.sub{
    color: var(--muted);
    font-size: 0.92rem;
    max-width: 320px;
    margin: 0;
  }

  .sc-chips{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem;
    max-width: 480px;
  }
  .sc-chip{
    background: var(--card);
    border: 1px solid var(--stroke);
    color: var(--text);
    font-size: 0.82rem;
    padding: 0.55rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .sc-chip:hover{ border-color: var(--stroke-strong); background: var(--panel); }

  .sc-thread{
    flex: 1;
    padding: 1.5rem 1.5rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .sc-msg{ display: flex; gap: 0.6rem; max-width: 100%; }
  .sc-msg.user{ flex-direction: row-reverse; }

  .sc-avatar{
    width: 22px; height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
    margin-top: 2px;
  }
  .sc-msg.user .sc-avatar{
    background: var(--card);
    border: 1px solid var(--stroke-strong);
  }

  .sc-bubble{
    padding: 0.55rem 0.8rem;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.5;
    white-space: pre-wrap;
    max-width: min(70%, 480px);
    width: fit-content;
  }
  .sc-msg.assistant .sc-bubble{
    background: var(--card);
    border: 1px solid var(--stroke);
    border-top-left-radius: 4px;
    position: relative;
    padding-right: 2rem;
  }
  .sc-copy{
    position: absolute;
    top: 0.4rem;
    right: 0.4rem;
    background: transparent;
    border: none;
    color: var(--faint);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0.15rem 0.3rem;
    border-radius: 4px;
  }
  .sc-copy:hover{ color: var(--text); background: var(--stroke); }
  .sc-msg.user .sc-bubble{
    background: linear-gradient(135deg, rgba(111,134,255,0.18), rgba(176,108,255,0.18));
    border: 1px solid rgba(176,108,255,0.28);
    border-top-right-radius: 4px;
  }

  .sc-typing{ display: flex; gap: 4px; align-items: center; padding: 0.3rem 0; }
  .sc-typing span{
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: typing 1.1s infinite ease-in-out;
  }
  .sc-typing span:nth-child(2){ animation-delay: 0.15s; }
  .sc-typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes typing{
    0%, 60%, 100%{ opacity: 0.25; transform: translateY(0); }
    30%{ opacity: 1; transform: translateY(-2px); }
  }

  .sc-error{
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
    padding: 0 1.5rem;
    color: #ff9d8a;
    font-size: 0.82rem;
  }

  .sc-inputbar{
    flex-shrink: 0;
    padding: 1rem 1.5rem 1.3rem;
    border-top: 1px solid var(--stroke);
  }
  .sc-inputwrap{
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 0.6rem;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 16px;
    padding: 0.6rem 0.6rem 0.6rem 1rem;
  }
  .sc-inputwrap:focus-within{ border-color: var(--accent-1); }

  .sc-inputwrap textarea{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    line-height: 1.4;
    max-height: 160px;
    padding: 0.3rem 0;
  }
  .sc-inputwrap textarea::placeholder{ color: var(--faint); }

  .sc-send{
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
    color: #0b0c10;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .sc-send:disabled{ opacity: 0.35; cursor: not-allowed; }
  .sc-send:active:not(:disabled){ transform: scale(0.94); }

  .sc-convitem .title-input{
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--accent-1);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.1rem 0.3rem;
  }

  .sc-feedback{
    display: flex;
    gap: 0.3rem;
    margin-top: 0.4rem;
  }
  .sc-feedback button{
    background: transparent;
    border: 1px solid var(--stroke);
    border-radius: 6px;
    padding: 0.1rem 0.35rem;
    font-size: 0.78rem;
    cursor: pointer;
    color: var(--faint);
  }
  .sc-feedback button:hover{ border-color: var(--stroke-strong); color: var(--text); }
  .sc-feedback button.active{ border-color: var(--accent-1); color: var(--text); background: var(--stroke); }

  .sc-followups{
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.2rem 0 0.4rem 2rem;
    max-width: 720px;
  }
  .sc-followup-chip{
    background: var(--card);
    border: 1px solid var(--stroke);
    color: var(--muted);
    font-size: 0.78rem;
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .sc-followup-chip:hover{ border-color: var(--accent-1); color: var(--text); }

  .sc-mic{
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--stroke);
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .sc-mic:hover{ border-color: var(--stroke-strong); color: var(--text); }
  .sc-mic.recording{
    color: #ff9d8a;
    border-color: #ff9d8a;
    animation: pulse-mic 1s infinite;
  }
  @keyframes pulse-mic{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.5; }
  }

  .sc-hint{
    text-align: center;
    font-size: 0.72rem;
    color: var(--faint);
    margin-top: 0.55rem;
  }

  .sc-limit{
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 0.7rem 1rem;
  }
  .sc-limit b{ color: var(--text); }

  @media (max-width: 640px){
    .sc-header{ padding: 0.85rem 1rem; }
    .sc-thread{ padding: 1.2rem 1rem 0.5rem; }
    .sc-inputbar{ padding: 0.8rem 1rem 1.1rem; }
    .sc-welcome h1{ font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div id="layout">
  <aside class="sc-sidebar" id="sidebar">
    <button class="sc-newchat" id="newChatBtn">
      <span>+</span> Nuevo chat
    </button>
    <div class="sc-convlist" id="convList"></div>
  </aside>

  <div id="app">
  <header class="sc-header">
    <div class="sc-brand">
      <button class="sc-sidebar-toggle" id="sidebarToggle" aria-label="Historial">☰</button>
      <span class="sc-dot"></span>
      <span class="sc-brand-name">Socium IA</span>
    </div>
    <div class="sc-plan">
      <button class="sc-theme-toggle" id="themeToggle" aria-label="Cambiar tema">🌙</button>
      <span class="badge">Flash</span>
      <span id="remainingLabel">15/15 consultas hoy</span>
    </div>
  </header>

  <div class="sc-body" id="scBody">
    <div class="sc-welcome" id="welcome">
      <div class="sc-orb"></div>
      <h1>¿En qué te ayudo hoy?</h1>
      <p class="sub">Pregúntame lo que necesites. Con el plan Flash tienes 15 consultas gratis cada día.</p>
      <div class="sc-chips" id="chips">
        <button class="sc-chip">Resume este texto en 3 puntos clave</button>
        <button class="sc-chip">Dame ideas para el nombre de mi producto</button>
        <button class="sc-chip">Explícame esto como si tuviera 10 años</button>
      </div>
    </div>
    <div class="sc-thread" id="thread" style="display:none;"></div>
    <div class="sc-error" id="errorBox" style="display:none;"></div>
  </div>

  <div class="sc-inputbar" id="inputBar">
    <div class="sc-inputwrap">
      <textarea id="textInput" rows="1" placeholder="Escribe tu mensaje…"></textarea>
      <button class="sc-mic" id="micBtn" aria-label="Dictar por voz" type="button">🎤</button>
      <button class="sc-send" id="sendBtn" disabled aria-label="Enviar mensaje">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor" />
        </svg>
      </button>
    </div>
    <p class="sc-hint">Enter para enviar · Shift + Enter para salto de línea · <span id="charCount">0</span> caracteres</p>
  </div>
  </div>
</div>

<script>
  // Cambia esto por la URL real de tu backend cuando lo despliegues
  const API_URL = "https://socium.onrender.com/api/chat";
  const DAILY_LIMIT = 15;

  const STORAGE_KEY = "socium_conversations_v1";

  let conversations = [];       // [{id, title, messages, updatedAt}]
  let currentId = null;
  let isLoading = false;
  let showTypingIndicator = false;
  let typingTimer = null;
  let remaining = DAILY_LIMIT;

  const welcome = document.getElementById("welcome");
  const thread = document.getElementById("thread");
  const scBody = document.getElementById("scBody");
  const errorBox = document.getElementById("errorBox");
  const inputBar = document.getElementById("inputBar");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const remainingLabel = document.getElementById("remainingLabel");
  const sidebar = document.getElementById("sidebar");
  const sidebarToggle = document.getElementById("sidebarToggle");
  const convList = document.getElementById("convList");
  const newChatBtn = document.getElementById("newChatBtn");

  // --- Persistencia de conversaciones (localStorage) ---
  function loadConversations() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      conversations = raw ? JSON.parse(raw) : [];
    } catch {
      conversations = [];
    }
    if (conversations.length === 0) {
      createConversation();
    } else {
      currentId = conversations[0].id;
    }
  }

  function saveConversations() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  }

  function getCurrentConversation() {
    return conversations.find((c) => c.id === currentId);
  }

  function createConversation() {
    const convo = {
      id: `c_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      title: "Nueva conversación",
      messages: [],
      updatedAt: Date.now(),
    };
    conversations.unshift(convo);
    currentId = convo.id;
    saveConversations();
    renderSidebar();
    renderMessages();
    closeSidebarOnMobile();
  }

  function switchConversation(id) {
    currentId = id;
    renderSidebar();
    renderMessages();
    closeSidebarOnMobile();
  }

  function deleteConversation(id) {
    conversations = conversations.filter((c) => c.id !== id);
    if (currentId === id) {
      if (conversations.length === 0) {
        createConversation();
        return;
      }
      currentId = conversations[0].id;
    }
    saveConversations();
    renderSidebar();
    renderMessages();
  }

  function renderSidebar() {
    convList.innerHTML = conversations
      .map(
        (c) => `
        <div class="sc-convitem ${c.id === currentId ? "active" : ""}" data-id="${c.id}">
          <span class="title" data-title="${c.id}">${escapeHtml(c.title)}</span>
          <span class="del" data-del="${c.id}">✕</span>
        </div>`
      )
      .join("");
  }

  function startRenaming(id) {
    const convo = conversations.find((c) => c.id === id);
    if (!convo) return;
    const span = convList.querySelector(`[data-title="${id}"]`);
    if (!span) return;
    const input = document.createElement("input");
    input.className = "title-input";
    input.value = convo.title;
    span.replaceWith(input);
    input.focus();
    input.select();

    const commit = () => {
      const newTitle = input.value.trim() || convo.title;
      convo.title = newTitle;
      saveConversations();
      renderSidebar();
    };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") input.blur();
      if (e.key === "Escape") { input.value = convo.title; input.blur(); }
    });
  }

  convList.addEventListener("dblclick", (e) => {
    const titleEl = e.target.closest(".title");
    if (titleEl) startRenaming(titleEl.getAttribute("data-title"));
  });

  function closeSidebarOnMobile() {
    sidebar.classList.remove("open");
  }

  convList.addEventListener("click", (e) => {
    const delId = e.target.getAttribute("data-del");
    if (delId) {
      deleteConversation(delId);
      return;
    }
    const item = e.target.closest(".sc-convitem");
    if (item) switchConversation(item.getAttribute("data-id"));
  });

  newChatBtn.addEventListener("click", createConversation);
  sidebarToggle.addEventListener("click", () => sidebar.classList.toggle("open"));

  function autoGrow() {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 160) + "px";
  }

  function updateRemainingLabel() {
    remainingLabel.textContent = `${Math.max(remaining, 0)}/${DAILY_LIMIT} consultas hoy`;
  }

  const FOLLOWUP_SUGGESTIONS = [
    "Explícamelo más simple",
    "Dame un ejemplo",
    "Resúmelo en una frase",
  ];

  function renderMessages() {
    const convo = getCurrentConversation();
    const msgs = convo ? convo.messages : [];

    if (msgs.length === 0) {
      welcome.style.display = "flex";
      thread.style.display = "none";
      return;
    }
    welcome.style.display = "none";
    thread.style.display = "flex";
    const lastIndex = msgs.length - 1;
    thread.innerHTML = msgs
      .map((m, i) => {
        const isLastAssistant = m.role === "assistant" && i === lastIndex && !isLoading;
        const feedback = m.feedback || null;
        return `
        <div class="sc-msg ${m.role}">
          <div class="sc-avatar"></div>
          <div class="sc-bubble">
            ${escapeHtml(m.content)}
            ${m.role === "assistant" ? `<button class="sc-copy" data-copy-index="${i}" aria-label="Copiar respuesta">⧉</button>` : ""}
            ${m.role === "assistant" ? `
              <div class="sc-feedback">
                <button data-fb="up" data-fb-index="${i}" class="${feedback === "up" ? "active" : ""}">👍</button>
                <button data-fb="down" data-fb-index="${i}" class="${feedback === "down" ? "active" : ""}">👎</button>
              </div>` : ""}
          </div>
        </div>
        ${isLastAssistant ? `
          <div class="sc-followups">
            ${FOLLOWUP_SUGGESTIONS.map((s) => `<button class="sc-followup-chip">${escapeHtml(s)}</button>`).join("")}
          </div>` : ""}`;
      })
      .join("");

    if (showTypingIndicator) {
      thread.innerHTML += `
        <div class="sc-msg assistant">
          <div class="sc-avatar"></div>
          <div class="sc-bubble">
            <div class="sc-typing"><span></span><span></span><span></span></div>
          </div>
        </div>`;
    }
    scBody.scrollTop = scBody.scrollHeight;
  }

  thread.addEventListener("click", (e) => {
    const fbBtn = e.target.closest("[data-fb]");
    if (fbBtn) {
      const convo = getCurrentConversation();
      const idx = Number(fbBtn.getAttribute("data-fb-index"));
      const value = fbBtn.getAttribute("data-fb");
      if (convo?.messages[idx]) {
        convo.messages[idx].feedback = convo.messages[idx].feedback === value ? null : value;
        saveConversations();
        renderMessages();
      }
      return;
    }
    const followupBtn = e.target.closest(".sc-followup-chip");
    if (followupBtn) {
      send(followupBtn.textContent);
      return;
    }
  });

  thread.addEventListener("click", (e) => {
    const btn = e.target.closest(".sc-copy");
    if (!btn) return;
    const convo = getCurrentConversation();
    const idx = Number(btn.getAttribute("data-copy-index"));
    const text = convo?.messages[idx]?.content || "";
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = "✓";
      setTimeout(() => { btn.textContent = original; }, 1200);
    });
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderLimitState() {
    if (remaining <= 0) {
      inputBar.innerHTML = `
        <div class="sc-limit">
          Llegaste a tus <b>${DAILY_LIMIT} consultas</b> gratis de hoy. Vuelven mañana, o pasa a <b>Pro</b> para más consultas diarias.
        </div>`;
    }
  }

  async function send(textOverride) {
    const text = (textOverride ?? textInput.value).trim();
    if (!text || isLoading || remaining <= 0) return;

    const convo = getCurrentConversation();
    if (!convo) return;

    errorBox.style.display = "none";
    convo.messages.push({ role: "user", content: text });
    if (convo.messages.length === 1) {
      convo.title = text.slice(0, 40) + (text.length > 40 ? "…" : "");
    }
    convo.updatedAt = Date.now();
    saveConversations();
    renderSidebar();

    textInput.value = "";
    autoGrow();
    charCount.textContent = "0";
    isLoading = true;
    sendBtn.disabled = true;
    showTypingIndicator = false;
    renderMessages();
    typingTimer = setTimeout(() => {
      showTypingIndicator = true;
      renderMessages();
    }, 350);

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: convo.messages }),
      });

      if (response.status === 429) {
        remaining = 0;
        errorBox.textContent = "Llegaste a tu límite de consultas diarias. Vuelven mañana.";
        errorBox.style.display = "block";
        renderLimitState();
        return;
      }

      if (!response.ok) throw new Error("Error del servidor");

      const data = await response.json();
      const replyText = (data.content || [])
        .map((block) => (block.type === "text" ? block.text : ""))
        .filter(Boolean)
        .join("\n");

      convo.messages.push({ role: "assistant", content: replyText || "No obtuve una respuesta. Intenta de nuevo." });
      convo.updatedAt = Date.now();
      saveConversations();

      if (typeof data.remaining === "number") {
        remaining = data.remaining;
        updateRemainingLabel();
        if (remaining <= 0) renderLimitState();
      }
    } catch (err) {
      errorBox.textContent = "No pudimos conectar con Socium IA. Intenta de nuevo en un momento.";
      errorBox.style.display = "block";
    } finally {
      isLoading = false;
      showTypingIndicator = false;
      clearTimeout(typingTimer);
      renderMessages();
    }
  }

  const charCount = document.getElementById("charCount");
  const themeToggle = document.getElementById("themeToggle");
  const micBtn = document.getElementById("micBtn");

  // --- Dictado por voz ---
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = "es-ES";
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      textInput.value = (textInput.value ? textInput.value + " " : "") + transcript;
      autoGrow();
      sendBtn.disabled = !textInput.value.trim();
      charCount.textContent = textInput.value.length;
    };

    recognition.onend = () => {
      isRecording = false;
      micBtn.classList.remove("recording");
    };

    recognition.onerror = () => {
      isRecording = false;
      micBtn.classList.remove("recording");
    };

    micBtn.addEventListener("click", () => {
      if (isRecording) {
        recognition.stop();
        return;
      }
      isRecording = true;
      micBtn.classList.add("recording");
      recognition.start();
    });
  } else {
    micBtn.style.display = "none"; // el navegador no soporta dictado por voz
  }

  textInput.addEventListener("input", () => {
    autoGrow();
    sendBtn.disabled = !textInput.value.trim();
    charCount.textContent = textInput.value.length;
  });

  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener("click", () => send());

  document.getElementById("chips").addEventListener("click", (e) => {
    if (e.target.classList.contains("sc-chip")) {
      send(e.target.textContent);
    }
  });

  // --- Tema claro/oscuro ---
  const THEME_KEY = "socium_theme";

  function applyTheme(theme) {
    document.body.classList.toggle("light", theme === "light");
    themeToggle.textContent = theme === "light" ? "☀️" : "🌙";
  }

  function loadTheme() {
    const saved = localStorage.getItem(THEME_KEY) || "dark";
    applyTheme(saved);
  }

  themeToggle.addEventListener("click", () => {
    const isLight = document.body.classList.contains("light");
    const next = isLight ? "dark" : "light";
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });

  loadTheme();
  loadConversations();
  renderSidebar();
  renderMessages();
  updateRemainingLabel();
</script>

</body>
</html>
